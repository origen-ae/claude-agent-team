name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # Run on Windows too — the hook/scripts target Windows as a first-class
    # platform, so prove they work there (no POSIX-shell assumptions).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Use bash on every OS (Git Bash ships on the Windows runner) so the
    # heredoc python steps run identically; the scripts still execute as native
    # Windows Python, which is what we're validating.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r assets/scripts/requirements.txt

      - name: Compile dashboard scripts
        run: python -m py_compile assets/scripts/*.py

      - name: Validate settings.json
        run: python -c "import json; json.load(open('assets/.claude/settings.json', encoding='utf-8')); print('settings.json is valid JSON')"

      - name: Run scripts against the worked example
        run: |
          python - <<'PY'
          import shutil, subprocess, sys, tempfile
          from pathlib import Path

          tmp = Path(tempfile.mkdtemp())
          shutil.copytree('assets/scripts', tmp / 'scripts')
          shutil.copytree('examples/loyalty-points-checkout/docs', tmp / 'docs')
          shutil.copy('assets/docs/backlog.md', tmp / 'docs' / 'backlog.md')

          def run(args, expect_zero=True):
              r = subprocess.run([sys.executable, *args], cwd=tmp)
              if expect_zero and r.returncode != 0:
                  print(f'FAIL  {args} -> exit {r.returncode}')
                  sys.exit(1)
              return r.returncode

          run(['scripts/build_index.py'])
          run(['scripts/build_status.py'])
          run(['scripts/check_state.py'])           # example is internally consistent
          status = (tmp / 'STATUS.md').read_text(encoding='utf-8')
          assert 'PRD-001' in status and len(status) > 200, 'STATUS.md looks empty'
          nid = subprocess.run([sys.executable, 'scripts/next_id.py', 'prd'], cwd=tmp, capture_output=True, text=True)
          assert nid.stdout.strip() == 'PRD-002', f'next_id wrong: {nid.stdout!r}'

          # Path guard: block cross-boundary, allow same-side / unknown agent
          import json
          (tmp / '.claude').mkdir(exist_ok=True)
          shutil.copy('assets/.claude/agent-team-boundaries.json', tmp / '.claude' / 'agent-team-boundaries.json')
          def guard(agent, path):
              payload = {'tool_name': 'Write', 'tool_input': {'file_path': path}, 'cwd': str(tmp)}
              if agent:
                  payload['agent_type'] = agent
              r = subprocess.run([sys.executable, 'scripts/guard_paths.py'], cwd=tmp,
                                 input=json.dumps(payload), capture_output=True, text=True)
              return r.returncode
          assert guard('frontend', 'src/backend/api.py') == 2, 'guard should block frontend->backend'
          assert guard('backend', 'src/frontend/App.tsx') == 2, 'guard should block backend->frontend'
          assert guard('frontend', 'src/frontend/App.tsx') == 0, 'guard should allow frontend->frontend'
          assert guard(None, 'src/backend/api.py') == 0, 'guard should allow when agent unknown (fail open)'
          assert guard('frontend', 'src/backendish/x.ts') == 0, 'guard should not false-positive on backendish'

          # Regression (found via multi-PRD testing): cancelled/superseded must
          # NOT be flagged for a missing SPEC/TEST-PLAN (they're terminal
          # off-ramps); a jumped-ahead requirement MUST be flagged.
          reg = Path(tempfile.mkdtemp())
          shutil.copytree('assets/scripts', reg / 'scripts')
          (reg / 'docs' / 'prd').mkdir(parents=True)
          def wprd(rid, stage, extra=''):
              (reg / 'docs' / 'prd' / f'{rid}.md').write_text(
                  f'---\nid: {rid}\ntitle: t\ntype: prd\nstage: {stage}\nowner: pm\n'
                  f'created: 2026-01-01\nupdated: 2026-01-01\nsummary: s\n{extra}---\n', encoding='utf-8')
          wprd('PRD-001', 'cancelled', 'cancelled-reason: dropped\n')
          wprd('PRD-002', 'superseded', 'superseded-by: PRD-003\n')
          wprd('PRD-003', 'testing-round1')   # jumped ahead: no SPEC/TEST-PLAN
          sys.path.insert(0, str(reg / 'scripts'))
          import build_status as bs
          warns = ' '.join(m for _, m in bs.compute_state_warnings(bs.group_by_requirement(bs.load_all_docs())))
          assert 'PRD-001' not in warns and 'PRD-002' not in warns, f'cancelled/superseded falsely flagged: {warns}'
          assert 'PRD-003' in warns, f'jumped-ahead PRD not flagged: {warns}'

          print('scripts ran clean; STATUS non-empty; next_id=PRD-002; path guard ok; state-warning regression ok')
          PY

      - name: Validate document frontmatter
        run: |
          python - <<'PY'
          import glob, sys, frontmatter

          files = (
              glob.glob('assets/.claude/agents/*.md')
              + glob.glob('assets/.claude/skills/*/SKILL.md')
              + glob.glob('assets/docs/_templates/*.md')
              + glob.glob('assets/docs/adr/*.md')
              + glob.glob('examples/**/docs/**/*.md', recursive=True)
              + ['SKILL.md']
          )
          bad = []
          for f in sorted(set(files)):
              try:
                  meta = frontmatter.load(f).metadata
                  if not meta:
                      bad.append((f, 'empty frontmatter'))
              except Exception as e:
                  bad.append((f, str(e)))

          print(f'checked {len(set(files))} files')
          if bad:
              for f, e in bad:
                  print(f'FAIL  {f}  ->  {e}')
              sys.exit(1)
          print('all frontmatter valid')
          PY

      - name: Validate agent required fields
        run: |
          python - <<'PY'
          import glob, sys, frontmatter

          REQUIRED = {'name', 'description', 'tools', 'model'}
          agent_files = sorted(glob.glob('assets/.claude/agents/*.md'))
          bad = []
          for f in agent_files:
              try:
                  meta = frontmatter.load(f).metadata
                  missing = REQUIRED - set(meta.keys())
                  if missing:
                      bad.append((f, f'missing required fields: {", ".join(sorted(missing))}'))
              except Exception as e:
                  bad.append((f, str(e)))

          print(f'checked {len(agent_files)} agent files for required fields: {sorted(REQUIRED)}')
          if bad:
              for f, e in bad:
                  print(f'FAIL  {f}  ->  {e}')
              sys.exit(1)
          print('all agent fields valid')
          PY
