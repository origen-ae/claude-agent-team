name: sync-marketplace

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Update claude-plugins marketplace SHA
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MARKETPLACE_TOKEN }}
          script: |
            const sha = context.sha

            // Read current marketplace.json from claude-plugins repo
            const { data: file } = await github.rest.repos.getContent({
              owner: 'origen-ae',
              repo: 'claude-plugins',
              path: '.claude-plugin/marketplace.json'
            })

            const manifest = JSON.parse(Buffer.from(file.content, 'base64').toString())

            // Update SHA for claude-agent-team
            const plugin = manifest.plugins.find(p => p.name === 'claude-agent-team')
            if (!plugin) {
              core.setFailed('claude-agent-team not found in marketplace.json')
              return
            }
            const prev = plugin.source.sha
            plugin.source.sha = sha

            // Write back
            await github.rest.repos.createOrUpdateFileContents({
              owner: 'origen-ae',
              repo: 'claude-plugins',
              path: '.claude-plugin/marketplace.json',
              message: `chore: sync claude-agent-team ${prev.slice(0,7)} → ${sha.slice(0,7)}`,
              content: Buffer.from(JSON.stringify(manifest, null, 2) + '\n').toString('base64'),
              sha: file.sha
            })

            console.log(`Marketplace updated: ${prev.slice(0,7)} → ${sha.slice(0,7)}`)
